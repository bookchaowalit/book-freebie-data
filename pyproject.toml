[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "book-freebie-data"
version = "0.1.0"
description = "Find zero-price offers with redemption and hidden-cost terms."
requires-python = ">=3.10"
dependencies = ["jsonschema==4.19.2"]

[project.scripts]
book-freebie-data = "book_freebie_data.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
book_freebie_data = ["*.json"]
